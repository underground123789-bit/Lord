name: Build CMD Helper (Windows)

on:
  push:
    paths:
      - "CmdHelper/**"
      - ".github/workflows/build-cmd-helper.yml"
    tags:
      - "cmd-helper-v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: CmdHelper
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: python -m pip install --upgrade pyinstaller

      - name: Build portable exe
        run: python -m PyInstaller --noconfirm --onefile --windowed --name CMD-Helper --add-data "commands.json;." cmd_helper.py

      - name: Check the exe was built
        shell: pwsh
        run: |
          $exe = Get-Item dist/CMD-Helper.exe
          "Built $($exe.FullName) ($([math]::Round($exe.Length/1MB,1)) MB)"

      - uses: actions/upload-artifact@v4
        with:
          name: CMD-Helper-portable
          path: CmdHelper/dist/CMD-Helper.exe

      - name: Publish release (only for cmd-helper-v* tags)
        if: startsWith(github.ref, 'refs/tags/cmd-helper-v')
        uses: softprops/action-gh-release@v2
        with:
          files: CmdHelper/dist/CMD-Helper.exe
